<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma Capilar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #FBF6EF;
    --card: #FFFFFF;
    --ink: #2B2420;
    --ink-soft: #746A61;
    --rose: #B4776B;
    --rose-soft: #F2E1DC;
    --sage: #77906F;
    --sage-soft: #E4EBDF;
    --gold: #AE8A4E;
    --gold-soft: #F0E4CC;
    --line: #EAE1D6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--ivory);
    color: var(--ink);
    padding: 36px 18px 70px;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    text-align: center;
    margin-bottom: 34px;
  }
  .header .kicker {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .header h1 {
    font-family: 'Fraunces', serif;
    font-size: 30px;
    font-weight: 500;
    margin: 6px 0 8px;
    letter-spacing: -0.01em;
  }
  .header p {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    max-width: 320px;
    margin: 0 auto;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.gold { background: var(--gold); }
  .dot.sage { background: var(--sage); }
  .dot.rose { background: var(--rose); }

  .week {
    margin-bottom: 28px;
    background: var(--card);
    border-radius: 20px;
    padding: 18px 16px 16px;
    box-shadow: 0 1px 2px rgba(43,36,32,0.04), 0 8px 24px rgba(43,36,32,0.05);
  }
  .week-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
    padding: 0 4px;
  }
  .week-num {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    color: var(--rose);
    font-weight: 500;
  }
  .week-phase {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .days {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .day {
    position: relative;
    background: var(--ivory);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 6px 12px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .day:active {
    transform: scale(0.96);
  }
  .day-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin: 0 auto 8px;
  }
  .day-weekday {
    font-size: 10.5px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .day-num {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    margin: 2px 0 6px;
  }
  .day-tag {
    font-size: 10.5px;
    color: var(--ink-soft);
    line-height: 1.3;
  }

  .note {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.7;
    max-width: 300px;
    margin: 18px auto 0;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43,36,32,0.5);
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 26px 22px 30px;
    animation: rise 0.2s ease-out;
  }
  @keyframes rise {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .sheet-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .sheet-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
  }
  .sheet-date {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .sheet-title {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    margin: 8px 0 16px;
  }
  .sheet-product {
    display: inline-block;
    background: var(--rose-soft);
    color: var(--rose);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 100px;
    margin-bottom: 18px;
  }
  .sheet-block-label {
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .steps {
    list-style: none;
  }
  .steps li {
    font-size: 14px;
    line-height: 1.55;
    margin-bottom: 10px;
    padding-left: 28px;
    position: relative;
    color: var(--ink);
  }
  .steps li span.num {
    position: absolute;
    left: 0;
    top: 1px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--sage-soft);
    color: var(--sage);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: var(--ink);
    color: var(--ivory);
    border: none;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Manrope', sans-serif;
  }
</style>
</head>
<body>

<div class="header">
  <div class="kicker">A partir de 7 de setembro</div>
  <h1>Cronograma capilar</h1>
  <p>Toque em um dia para ver o produto e o passo a passo completo.</p>
</div>

<div class="legend">
  <div class="legend-item"><span class="dot gold"></span>Nutrição</div>
  <div class="legend-item"><span class="dot sage"></span>Hidratação</div>
  <div class="legend-item"><span class="dot rose"></span>Reconstrução</div>
</div>

<div id="calendar"></div>

<div class="note">
  Nos demais dias, sem lavagem de tratamento. Leave-in e creme de pentear diariamente, óleo de argan de duas a três vezes por semana.
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-top">
      <div class="sheet-dot" id="sheetDot"></div>
      <div class="sheet-date" id="sheetDate"></div>
    </div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-product" id="sheetProduct"></div>

    <div class="sheet-block-label">Passo a passo</div>
    <ol class="steps" id="sheetSteps"></ol>

    <button class="close-btn" onclick="closeSheet()">Fechar</button>
  </div>
</div>

<script>
const colors = { nutricao: 'gold', hidratacao: 'sage', reconstrucao: 'rose' };

const stepsBase = [
  "Shampoo no couro cabeludo, deixando a espuma escorrer pelo comprimento",
  "Aplicar a máscara do meio às pontas, de 15 a 20 gramas",
  "Touca de tratamento, agir de 10 a 15 minutos",
  "Enxaguar",
  "Condicionador nas pontas"
];

const stepsReconstrucao = [
  "Shampoo no couro cabeludo",
  "Máscara Natura Lumina, de 15 a 20 gramas, com atenção extra nas mechas descoloridas",
  "Touca de tratamento, agir de 15 a 20 minutos",
  "Enxaguar bem",
  "Acidificante Widi Care, de 5 a 10 mililitros, mecha a mecha, de cima para baixo, agir 5 minutos",
  "Enxaguar com água fria",
  "Condicionador leve"
];

const stepsReconstrucaoLeve = [
  "Shampoo no couro cabeludo",
  "Máscara Natura Lumina, de 15 a 20 gramas",
  "Touca de tratamento, agir 15 minutos",
  "Enxaguar",
  "Condicionador, sem acidificante nesse dia"
];

const weeks = [
  {
    num: "01",
    phase: "Estabilização",
    days: [
      { date: "7 de setembro", weekday: "Seg", num: "7", type: "nutricao", title: "Nutrição", product: "Eudora Siàge Nutri Acid.Complex", steps: stepsBase },
      { date: "9 de setembro", weekday: "Qua", num: "9", type: "reconstrucao", title: "Reconstrução e acidificação", product: "Natura Lumina e Widi Care Infusão 2.0", steps: stepsReconstrucao },
      { date: "11 de setembro", weekday: "Sex", num: "11", type: "hidratacao", title: "Hidratação", product: "Lola Dream Cream", steps: stepsBase }
    ]
  },
  {
    num: "02",
    phase: "Emoliência e frizz",
    days: [
      { date: "14 de setembro", weekday: "Seg", num: "14", type: "nutricao", title: "Nutrição", product: "Eudora Siàge Nutri Acid.Complex", steps: stepsBase },
      { date: "16 de setembro", weekday: "Qua", num: "16", type: "hidratacao", title: "Hidratação", product: "Lola Dream Cream", steps: stepsBase },
      { date: "18 de setembro", weekday: "Sex", num: "18", type: "nutricao", title: "Nutrição", product: "Eudora Siàge Nutri Acid.Complex", steps: stepsBase }
    ]
  },
  {
    num: "03",
    phase: "Reforço estrutural",
    days: [
      { date: "21 de setembro", weekday: "Seg", num: "21", type: "hidratacao", title: "Hidratação", product: "Lola Dream Cream", steps: stepsBase },
      { date: "23 de setembro", weekday: "Qua", num: "23", type: "reconstrucao", title: "Reconstrução e acidificação", product: "Natura Lumina e Widi Care Infusão 2.0", steps: stepsReconstrucao },
      { date: "25 de setembro", weekday: "Sex", num: "25", type: "nutricao", title: "Nutrição", product: "Eudora Siàge Nutri Acid.Complex", steps: stepsBase }
    ]
  },
  {
    num: "04",
    phase: "Manutenção",
    days: [
      { date: "28 de setembro", weekday: "Seg", num: "28", type: "hidratacao", title: "Hidratação", product: "Lola Dream Cream", steps: stepsBase },
      { date: "30 de setembro", weekday: "Qua", num: "30", type: "nutricao", title: "Nutrição", product: "Eudora Siàge Nutri Acid.Complex", steps: stepsBase },
      { date: "2 de outubro", weekday: "Sex", num: "2", type: "reconstrucao", title: "Reconstrução leve", product: "Natura Lumina", steps: stepsReconstrucaoLeve }
    ]
  }
];

const calendar = document.getElementById('calendar');

weeks.forEach(week => {
  const weekDiv = document.createElement('div');
  weekDiv.className = 'week';

  const head = document.createElement('div');
  head.className = 'week-head';
  head.innerHTML = `<span class="week-num">${week.num}</span><span class="week-phase">${week.phase}</span>`;
  weekDiv.appendChild(head);

  const daysDiv = document.createElement('div');
  daysDiv.className = 'days';

  week.days.forEach(day => {
    const dayDiv = document.createElement('div');
    dayDiv.className = 'day';
    dayDiv.innerHTML = `
      <div class="day-dot" style="background: var(--${colors[day.type]})"></div>
      <div class="day-weekday">${day.weekday}</div>
      <div class="day-num">${day.num}</div>
      <div class="day-tag">${day.title}</div>
    `;
    dayDiv.onclick = () => openSheet(day);
    daysDiv.appendChild(dayDiv);
  });

  weekDiv.appendChild(daysDiv);
  calendar.appendChild(weekDiv);
});

function openSheet(day) {
  document.getElementById('sheetDot').style.background = `var(--${colors[day.type]})`;
  document.getElementById('sheetDate').textContent = day.date;
  document.getElementById('sheetTitle').textContent = day.title;
  document.getElementById('sheetProduct').textContent = day.product;
  document.getElementById('sheetProduct').style.background = `var(--${colors[day.type]}-soft)`;
  document.getElementById('sheetProduct').style.color = `var(--${colors[day.type]})`;

  const stepsList = document.getElementById('sheetSteps');
  stepsList.innerHTML = '';
  day.steps.forEach((step, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="num">${i + 1}</span>${step}`;
    stepsList.appendChild(li);
  });

  document.getElementById('overlay').classList.add('open');
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeSheet();
});
</script>

</body>
</html>
